# Shared base for both loggers: ESP32-S3-DevKitC-1, Wi-Fi, HA API, OTA,
# built-in web page (live readings without Home Assistant).
# Needs substitutions: device_name, friendly_name, api_key (!secret).

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
api:
  encryption:
    key: ${api_key}
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic
