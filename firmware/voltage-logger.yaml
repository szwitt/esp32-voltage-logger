# ESP32 Voltage Logger: shared ESPHome package.
# Don't edit per project. Include it from a small device file instead,
# see example-device.yaml.
#
# Required substitutions (set in the device file):
#   device_name, friendly_name, api_key (!secret), ch1_name .. ch4_name
# Optional (defaults below): report_interval, calibration per channel.

substitutions:
  report_interval: 1s
  # ADC mid-scale (V) where 0 V input sits after the diff-to-single-ended stage.
  mid: "1.65"
  # Nominal gains, input volts per ADC volt (see docs/requirements.md).
  # Replace with calibrated values per channel in the device file.
  ch1_k_hv: "395.3"
  ch1_k_lv: "39.3"
  ch1_zero_hv: "0"
  ch1_zero_lv: "0"
  ch2_k_hv: "395.3"
  ch2_k_lv: "39.3"
  ch2_zero_hv: "0"
  ch2_zero_lv: "0"
  ch3_k_hv: "395.3"
  ch3_k_lv: "39.3"
  ch3_zero_hv: "0"
  ch3_zero_lv: "0"
  # CH4 power channel (PZEM-004T): optional trim multipliers.
  ch4_v_cal: "1.0"
  ch4_i_cal: "1.0"
  ch4_p_cal: "1.0"
  # F1, F2 frequency inputs. pulse_counter reports pulses per minute;
  # multiply by scale_per_min to get your unit. Hz: 1/60. rpm, 12-pulse tach: 1/12.
  f1_name: "F1"
  f1_unit: "Hz"
  f1_scale_per_min: "0.0166667"
  f2_name: "F2"
  f2_unit: "Hz"
  f2_scale_per_min: "0.0166667"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
api:
  encryption:
    key: ${api_key}
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:   # FR-12: live readings without Home Assistant
  port: 80

# Expansion header (FR-11): I2C on GPIO8/9, 1-Wire on GPIO15.
# CH4 PZEM-004T is on UART1 GPIO17/18 (power-channel.yaml).
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

packages:
  ch1: !include { file: channel.yaml, vars: { ch: 1, pin: GPIO1, name: "${ch1_name}", report_interval: "${report_interval}", mid: "${mid}", k_hv: "${ch1_k_hv}", k_lv: "${ch1_k_lv}", zero_hv: "${ch1_zero_hv}", zero_lv: "${ch1_zero_lv}" } }
  ch2: !include { file: channel.yaml, vars: { ch: 2, pin: GPIO2, name: "${ch2_name}", report_interval: "${report_interval}", mid: "${mid}", k_hv: "${ch2_k_hv}", k_lv: "${ch2_k_lv}", zero_hv: "${ch2_zero_hv}", zero_lv: "${ch2_zero_lv}" } }
  ch3: !include { file: channel.yaml, vars: { ch: 3, pin: GPIO5, name: "${ch3_name}", report_interval: "${report_interval}", mid: "${mid}", k_hv: "${ch3_k_hv}", k_lv: "${ch3_k_lv}", zero_hv: "${ch3_zero_hv}", zero_lv: "${ch3_zero_lv}" } }
  ch4: !include power-channel.yaml
  freq: !include freq-inputs.yaml

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic
