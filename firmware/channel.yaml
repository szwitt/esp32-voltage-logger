# One isolated voltage channel. Included 4 times by voltage-logger.yaml
# with vars: ch (1..4), pin, name, plus calibration.
#
# Reports per channel:
#   <name> DC        mean voltage (V)
#   <name> AC RMS    RMS with DC removed (V)
#   <name> RMS       true RMS, sqrt(DC^2 + AC^2) (V)
#   <name> Range     select: HV (425 V pk) or LV (42 V pk), restored on boot
#
# Conversion: V_in = (V_adc - mid) * k, where k is the HV or LV gain.
# First cut on stock ESPHome components; a single-pass custom component
# (DC, AC RMS, min, max) is planned.

select:
  - platform: template
    id: ch${ch}_range
    name: "${name} Range"
    options: ["HV", "LV"]
    initial_option: "HV"
    optimistic: true
    restore_value: true
    entity_category: config

sensor:
  # Raw ADC voltage. Read fast; the DC sensor below averages it.
  - platform: adc
    id: ch${ch}_adc
    pin:
      number: ${pin}
      allow_other_uses: true
    attenuation: 12db
    update_interval: 13ms   # not a divisor of 50/60 Hz periods, so averages wash out AC
    internal: true
    on_value:
      then:
        - lambda: |-
            id(ch${ch}_sum) += x;
            id(ch${ch}_n) += 1;

  # DC: mean over the report interval, scaled by the selected range.
  - platform: template
    id: ch${ch}_dc
    name: "${name} DC"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    internal: false

  # AC RMS from ct_clamp (mean removed), in ADC volts. Scaled below.
  - platform: ct_clamp
    id: ch${ch}_ac_raw
    sensor: ch${ch}_adc
    sample_duration: 200ms  # 10 cycles at 50 Hz, 12 at 60 Hz
    update_interval: ${report_interval}
    internal: true
    on_value:
      then:
        - lambda: |-
            const float k = id(ch${ch}_range).current_option() == std::string("LV")
                ? ${k_lv} : ${k_hv};
            id(ch${ch}_ac).publish_state(x * k);

  - platform: template
    id: ch${ch}_ac
    name: "${name} AC RMS"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    on_value:
      then:
        - lambda: |-
            const float dc = id(ch${ch}_dc).state;
            if (!std::isnan(dc)) id(ch${ch}_rms).publish_state(sqrtf(dc * dc + x * x));

  - platform: template
    id: ch${ch}_rms
    name: "${name} RMS"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

# Running sum for the DC mean; published and reset every report interval.
globals:
  - id: ch${ch}_sum
    type: double
    initial_value: "0"
  - id: ch${ch}_n
    type: uint32_t
    initial_value: "0"

interval:
  - interval: ${report_interval}
    then:
      - lambda: |-
          if (id(ch${ch}_n) == 0) return;
          const float mean_adc = id(ch${ch}_sum) / id(ch${ch}_n);
          id(ch${ch}_sum) = 0; id(ch${ch}_n) = 0;
          const bool lv = id(ch${ch}_range).current_option() == std::string("LV");
          const float k = lv ? ${k_lv} : ${k_hv};
          const float zero = lv ? ${zero_lv} : ${zero_hv};
          id(ch${ch}_dc).publish_state((mean_adc - ${mid}) * k - zero);
