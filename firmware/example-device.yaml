# Example device file: copy per logger (or per project) and edit names and
# calibration. Everything else comes from the shared package.

substitutions:
  device_name: voltage-logger-1
  friendly_name: Voltage Logger 1
  api_key: !secret voltage_logger_1_api_key
  ch1_name: "CH1"
  ch2_name: "CH2"
  ch3_name: "CH3"
  ch4_name: "CH4"
  report_interval: 1s
  # Calibrated values go here, for example:
  # ch1_k_lv: "39.18"
  # ch1_zero_lv: "0.012"

packages:
  logger: !include voltage-logger.yaml
