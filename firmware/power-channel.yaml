# CH4 power channel: PZEM-004T v3.0 module (D-10) on UART1, Modbus 9600 baud.
# AC mains only (80-260 V). The module is factory calibrated; the ch4_*_cal
# multipliers are there for fine trimming against a reference meter.

uart:
  - id: pzem_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 9600

modbus:
  - id: pzem_modbus
    uart_id: pzem_uart

sensor:
  - platform: pzemac
    modbus_id: pzem_modbus
    update_interval: ${report_interval}
    voltage:
      name: "${ch4_name} AC RMS"
      filters:
        - multiply: ${ch4_v_cal}
    current:
      name: "${ch4_name} Current"
      accuracy_decimals: 3
      filters:
        - multiply: ${ch4_i_cal}
    power:
      name: "${ch4_name} Power"
      filters:
        - multiply: ${ch4_p_cal}
    energy:
      name: "${ch4_name} Energy"
    frequency:
      name: "${ch4_name} Frequency"
    power_factor:
      name: "${ch4_name} Power factor"
